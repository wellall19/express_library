services:
  library:
    build: .
    ports:
      - "3000:3000"
    environment:
      - COUNTER_URL=http://counter:3001
      - MONGO_URL=mongodb://root:example@mongo:27017/mydb?authSource=admin
    depends_on:
      - counter
      - mongo

  counter:
    build: ./counter-service
    ports:
      - "3001:3001"
    volumes:
      - counter_data:/app/data

  mongo:
    image: mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: mongoexpressuser
      ME_CONFIG_BASICAUTH_PASSWORD: mongoexpresspass

volumes:
  counter_data: {}